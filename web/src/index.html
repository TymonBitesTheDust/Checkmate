<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f3f6f2">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Checkmate: tasks, projects and reminders that sync across your devices.">
<title>Checkmate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f46b25'/%3E%3Cpath d='M17 33.5 27.5 44 47 21' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='47' cy='21' r='3.5' fill='%23F5C451'/%3E%3C/svg%3E">
<style>/*__FONT__*/</style>
<style>/*__CSS__*/</style>
<script>
  // Apply the saved theme before first paint to avoid a flash.
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('tickwise.prefs.v1') || '{}');
      var t = p.theme || 'system';
      var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (p.skin && p.skin !== 'tickwise') document.documentElement.dataset.skin = p.skin;
      var l = p.language || 'system';
      if (l === 'system') l = /^zh-(tw|hk|mo|hant)/i.test(navigator.language || '') ? 'zh-Hant' : 'en';
      document.documentElement.lang = l === 'zh-Hant' ? 'zh-Hant' : 'en';
      var v = p.accentVars && p.accentVars[dark ? 'dark' : 'light'];
      if (v && p.accent && p.accent !== 'orange' && (!p.skin || p.skin === 'tickwise')) for (var k in v) document.documentElement.style.setProperty(k, v[k]);
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="app"></div>
<noscript>Checkmate needs JavaScript turned on.</noscript>
<script>/*__JS__*/</script>
</body>
</html>
